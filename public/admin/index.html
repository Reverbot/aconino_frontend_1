<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0c2070" />
    <title>Editor del blog | Aconiño</title>
  </head>
  <body>
    <noscript>Necesitas activar JavaScript para usar el editor del blog.</noscript>
    <script>
      // Decap resolves config.yml relative to /admin/. Normalize /admin
      // before the CMS starts so both URLs work in static hosting.
      if (window.location.pathname === '/admin') {
        window.location.replace(`/admin/${window.location.search}${window.location.hash}`);
      }
    </script>
    <script src="https://unpkg.com/decap-cms@3.17.0-beta.0/dist/decap-cms.js"></script>
  </body>
</html>
